<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="voyage css.css">
    
</head>
<body>
    <img src="new voyage.jpg" class="logo">
    
   
<button class="open-btn" id="openBtn" onclick="openSidebar()">☰</button>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-logo">✈ LUXURY FLY</span>
    <button class="close-btn" onclick="closeSidebar()">×</button>
  </div>
  <nav>
    <a href="voyage html.html" class="active"><span class="nav-icon">🏠</span> Accueil</a>
    <a href="test.html" ><span class="nav-icon">✈</span> Voyage</a>
    <a href="contact.html" ><span class="nav-icon">✉</span> Contact</a>
  </nav>
  <div class="sidebar-footer">LUXURY FLY © 2025</div>
</div>

    <script>

  // ===== SIDEBAR =====
  function openSidebar() {
    document.getElementById("sidebar").style.width = "260px";
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("overlay").classList.add("show");
    document.getElementById("openBtn").style.display = "none";
  }
  function closeSidebar() {
    document.getElementById("sidebar").style.width = "0";
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
    document.getElementById("openBtn").style.display = "block";
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSidebar(); });

    </script>


 
  
    
</body>
</html>
