<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LUXURY FLY - Destinations</title>
  <link rel="stylesheet" href="test.css" />
</head>
<body>

<button class="open-btn" id="openBtn" onclick="openSidebar()">☰</button>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-logo">✈ LUXURY FLY</span>
    <button class="close-btn" onclick="closeSidebar()">×</button>
  </div>
  <nav>
    <a href="index.html"><span class="nav-icon">🏠</span> Accueil</a>
    <a href="test.html" class="active"><span class="nav-icon">✈</span> Voyage</a>
    <a href="contact.html"><span class="nav-icon">✉</span> Contact</a>
  </nav>
  <div class="sidebar-footer">LUXURY FLY © 2025</div>
</div>

<div class="search-container">
  <input type="text" id="search" placeholder="Rechercher une destination..." oninput="filtrer()" />
</div>

<section class="destinations" id="destinations">
  <p class="chargement">Chargement des destinations...</p>
</section>

<script>
  // ===== SIDEBAR =====
  function openSidebar() {
    document.getElementById("sidebar").style.width = "260px";
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("overlay").classList.add("show");
    document.getElementById("openBtn").style.display = "none";
  }
  function closeSidebar() {
    document.getElementById("sidebar").style.width = "0";
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
    document.getElementById("openBtn").style.display = "block";
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSidebar(); });

  // ===== CHARGEMENT DES VOYAGES =====
  fetch("voyage.php")
    .then(res => res.json())
    .then(voyages => {
      const section = document.getElementById("destinations");

      if (voyages.length === 0) {
        section.innerHTML = '<p class="chargement">Aucun voyage disponible.</p>';
        return;
      }

      section.innerHTML = voyages.map(v => `
        <div class="card" data-nom="${v.libelle.toLowerCase()}">
          <a href="detail.html?id=${v.id}">
            ${v.image
              ? `<img src="${v.image}" alt="${v.libelle}" />`
              : `<div class="no-img">Pas d'image</div>`
            }
            <div class="overlay-card">
              <h2>${v.libelle}</h2>
              <p>À partir de ${parseInt(v.prix).toLocaleString('fr-FR')}€</p>
            </div>
          </a>
        </div>
      `).join("");
    })
    .catch(err => {
      document.getElementById("destinations").innerHTML =
        '<p class="chargement">Erreur de chargement des destinations.</p>';
      console.error(err);
    });

  // ===== RECHERCHE =====
  function filtrer() {
    const val = document.getElementById("search").value.toLowerCase();
    document.querySelectorAll(".card").forEach(card => {
      card.style.display = card.dataset.nom.includes(val) ? "block" : "none";
    });
  }
</script>

</body>
</html>
